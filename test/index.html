const WIDTH = 4;
const HEIGHT = 5;
const DIRECTIONS = {up:[0,-1],right:[1,0],down:[0,1],left:[-1,0]};
const clone = (pieces) => pieces.map(p => ({...p}));
const escaped = (pieces) => pieces.some(p => p.id === 0 && p.x === 1 && p.y === 3);

function canPlace(pieces, piece, x, y, w = piece.w, h = piece.h) {
  if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x+w>WIDTH||y+h>HEIGHT) return false;
  return !pieces.some(p => p.id !== piece.id && p.x >= 0 && p.y >= 0 &&
    x < p.x+p.w && x+w > p.x && y < p.y+p.h && y+h > p.y);
}

function validateLayout(pieces, complete = true) {
  if(!Array.isArray(pieces)||pieces.length!==10) return {valid:false,message:'需要 1 枚曹操、5 位武将与 4 名小卒。'};
  const ids = new Set();
  let cao=0, generals=0, soldiers=0, placed=0;
  for(const p of pieces){
    if(!Number.isInteger(p.id)||ids.has(p.id)) return {valid:false,message:'棋子编号重复或无效。'};
    ids.add(p.id);
    if(p.id===0&&p.w===2&&p.h===2) cao++;
    else if(p.id>=1&&p.id<=5&&((p.w===1&&p.h===2)||(p.w===2&&p.h===1))) generals++;
    else if(p.id>=6&&p.id<=9&&p.w===1&&p.h===1) soldiers++;
    else return {valid:false,message:'棋子尺寸不符合传统华容道规则。'};
    if(p.x===-1&&p.y===-1) continue;
    if(!canPlace(pieces,p,p.x,p.y)) return {valid:false,message:'棋子不能重叠，也不能越出棋盘。'};
    placed++;
  }
  if(cao!==1||generals!==5||soldiers!==4) return {valid:false,message:'需要 1 枚曹操、5 位武将与 4 名小卒。'};
  if(complete&&placed!==10) return {valid:false,incomplete:true,placed,message:`已放置 ${placed}/10 枚棋子，请继续布阵。`};
  return {valid:true,placed,message:'棋子齐全，保留了 2 格空位。'};
}

function move(pieces, id, dx, dy) {
  if(!Number.isInteger(dx)||!Number.isInteger(dy)||Math.abs(dx)+Math.abs(dy)!==1) return null;
  const p = pieces.find(p => p.id===id);
  if(!p||p.x<0||!canPlace(pieces,p,p.x+dx,p.y+dy)) return null;
  return pieces.map(q => q.id===id ? {...q,x:q.x+dx,y:q.y+dy} : {...q});
}

function signature(pieces){
  return pieces.map(p => `${p.w}${p.h}:${p.x+4*p.y}`).sort().join('|');
}

// 同尺寸棋子在求解时等价。用 50 位精确整数保存各组排序后的位置。
// 宽度和高度属于求解器配置，不在状态中变化；避免哈希碰撞影响提示。
function solve(pieces, progress = () => {}, options = {}) {
  const checked = validateLayout(pieces);
  if(!checked.valid) return {status:'invalid',message:checked.message,path:[]};
  const started = Date.now();
  const limit = options.limit ?? 1000000;
  const timeLimit = options.timeLimit ?? 25000;
  const groups = [];
  const shapeOrder = [[2,2],[1,2],[2,1],[1,1]];
  const shapeW=[],shapeH=[],groupFor=[],start=[];
  for(const [w,h] of shapeOrder){
    const positions=pieces.filter(p=>p.w===w&&p.h===h).map(p=>p.x+4*p.y).sort((a,b)=>a-b);
    if(!positions.length) continue;
    const group={start:start.length,end:start.length+positions.length,w,h};
    const gi=groups.length;groups.push(group);
    positions.forEach(pos=>{start.push(pos);shapeW.push(w);shapeH.push(h);groupFor.push(gi);});
  }
  const n=start.length;
  const powers=Array.from({length:n},(_,i)=>32**i);
  const encode=(positions)=>positions.reduce((key,pos,i)=>key+pos*powers[i],0);
  const masks=shapeW.map((w,i)=>Array.from({length:20},(_,pos)=>{
    const x=pos%4,y=Math.floor(pos/4),h=shapeH[i];
    if(x+w>4||y+h>5) return 0;
    let mask=0;
    for(let row=0;row<h;row++)for(let col=0;col<w;col++)mask|=1<<(pos+row*4+col);
    return mask;
  }));
  const first=encode(start);
  const keys=[first],parents=[-1],steps=[0];
  const visited=new Map([[first,0]]);
  const positions=new Array(n);
  const deltas=[-4,1,4,-1];
  function result(index){
    const path=[];
    while(parents[index]!==-1){
      const step=steps[index],from=step&31,to=(step>>>5)&31,gi=step>>>10;
      path.push({from,to,w:groups[gi].w,h:groups[gi].h,dx:to%4-from%4,dy:Math.floor(to/4)-Math.floor(from/4)});
      index=parents[index];
    }
    path.reverse();
    return {status:'solved',path,visited:visited.size,ms:Date.now()-started};
  }
  for(let head=0;head<keys.length;head++){
    const key=keys[head];
    let value=key,occupied=0;
    for(let i=0;i<n;i++){const pos=value%32;value=Math.floor(value/32);positions[i]=pos;occupied|=masks[i][pos];}
    if(positions[0]===13) return result(head);
    if((head&4095)===0){
      progress({visited:visited.size});
      if(visited.size>limit||Date.now()-started>timeLimit)return {status:'limit',path:[],visited:visited.size};
    }
    for(let i=0;i<n;i++){
      const from=positions[i],x=from%4,y=Math.floor(from/4),w=shapeW[i],h=shapeH[i];
      const blockers=occupied^masks[i][from];
      for(let dir=0;dir<4;dir++){
        if((dir===0&&y===0)||(dir===1&&x+w===4)||(dir===2&&y+h===5)||(dir===3&&x===0))continue;
        const to=from+deltas[dir],mask=masks[i][to];
        if(!mask||(mask&blockers))continue;
        const next=positions.slice();next[i]=to;
        const group=groups[groupFor[i]];
        // 插入排序只调整被移动的一个棋子，不改变其他形状的索引。
        let j=i;
        while(j>group.start&&next[j]<next[j-1]){[next[j],next[j-1]]=[next[j-1],next[j]];j--;}
        while(j+1<group.end&&next[j]>next[j+1]){[next[j],next[j+1]]=[next[j+1],next[j]];j++;}
        const nextKey=encode(next);
        if(visited.has(nextKey))continue;
        const index=keys.length;
        visited.set(nextKey,index);keys.push(nextKey);parents.push(head);steps.push(from|(to<<5)|(groupFor[i]<<10));
        if(next[0]===13)return result(index);
      }
    }
  }
  return {status:'unsolvable',path:[],visited:visited.size,ms:Date.now()-started};
}

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

// 箭头在相邻空位的边缘，各方向只走一格，不要求先选中棋子。
function moveArrows(pieces) {
  const arrows = [];
  for (const p of pieces) for (const [direction, dx, dy] of [['up',0,-1],['right',1,0],['down',0,1],['left',-1,0]]) {
    if (p.x < 0 || !canPlace(pieces, p, p.x + dx, p.y + dy)) continue;
    const x = dx > 0 ? p.x + p.w + .18 : dx < 0 ? p.x - .18 : p.x + p.w/2;
    const y = dy > 0 ? p.y + p.h + .18 : dy < 0 ? p.y - .18 : p.y + p.h/2;
    arrows.push({id:p.id, direction, dx, dy, x, y});
  }
  return arrows;
}

function slideLimits(pieces, piece) {
  const limits = {left:0, right:0, up:0, down:0};
  for(const [name,dx,dy] of [['left',-1,0],['right',1,0],['up',0,-1],['down',0,1]]) {
    for(let distance=1;distance<=4;distance++) {
      if(!canPlace(pieces,piece,piece.x+dx*distance,piece.y+dy*distance)) break;
      limits[name]=distance;
    }
  }
  return limits;
}

// 只在合法方向间判断拖动意图，允许修正起手偏移；相近的斜向位移保持当前轴。
function slideDrag(limits, dx, dy, metrics, axis = null) {
  const x = (dx < 0 ? limits.left : limits.right) > 0 ? Math.abs(dx) : 0;
  const y = (dy < 0 ? limits.up : limits.down) > 0 ? Math.abs(dy) : 0;
  if (!x && !y) axis = null;
  else if (!(axis === 'x' && x > 0 && y <= x * 1.25 + 6) &&
           !(axis === 'y' && y > 0 && x <= y * 1.25 + 6)) axis = x >= y ? 'x' : 'y';
  return {
    axis,
    offsetX: axis === 'x' ? clamp(dx, -limits.left * metrics.cellX, limits.right * metrics.cellX) : 0,
    offsetY: axis === 'y' ? clamp(dy, -limits.up * metrics.cellY, limits.down * metrics.cellY) : 0
  };
}

// 只采样棋子的实际位移，碰到限位后光标继续移动不会积累虚假速度。
// 反向回拉时从转折点重新估算，避免先前的快速拖动盖过松手前的意图。
function dragSample(samples, position, time, tolerance=.3) {
  let recent=samples.filter(s=>time-s.time<=90);
  const last=recent.at(-1),delta=last?position-last.position:0;
  if(Math.abs(delta)>tolerance)for(let i=recent.length-1;i>0;i--) {
    const previous=recent[i].position-recent[i-1].position;
    if(Math.abs(previous)<=tolerance)continue;
    if(Math.sign(previous)!==Math.sign(delta))recent=[last];
    break;
  }
  if(last?.time===time)recent[recent.length-1]={position,time};
  else recent.push({position,time});
  return recent;
}

function dragVelocity(samples, releasedAt) {
  const recent=samples.filter(s=>releasedAt-s.time<=70&&releasedAt>=s.time);
  if(recent.length<2)return 0;
  const last=recent.at(-1),previous=recent.at(-2);
  if(releasedAt-last.time>40||last.time-previous.time>=50&&Math.abs(last.position-previous.position)<.3)return 0;
  let weight=0,time=0,position=0;
  for(const s of recent) {
    const w=Math.exp((s.time-releasedAt)/35);
    weight+=w;time+=w*s.time;position+=w*s.position;
  }
  time/=weight;position/=weight;
  let numerator=0,denominator=0;
  for(const s of recent) {
    const w=Math.exp((s.time-releasedAt)/35),dt=s.time-time;
    numerator+=w*dt*(s.position-position);denominator+=w*dt*dt;
  }
  return denominator>1e-6?numerator/denominator:0;
}

// 速度使用格/秒，吸附弹簧与阻尼也使用格为单位，大小屏和横竖方向手感一致。
// 摩擦停止点决定目标格；实际动画保留释放速度，并受合法行程的刚性限位约束。
function slideRelease(limits,axis,offset,cell,velocity=0,destination=null) {
  if(!axis||!Number.isFinite(cell)||cell<=0)return {axis,steps:0,start:0,cell,velocity:0,duration:0,frames:[]};
  const min=-(axis==='x'?limits.left:limits.up),max=axis==='x'?limits.right:limits.down;
  const start=clamp(offset/cell,min,max);
  let speed=clamp(Number.isFinite(velocity)?velocity*1000/cell:0,-8,8);
  if(Math.abs(speed)<.8||start<=min+1e-9&&speed<0||start>=max-1e-9&&speed>0)speed=0;
  const projected=clamp(start+speed*Math.abs(speed)/36,min,max);
  const steps=clamp(destination??(Math.abs(projected)<.24?0:Math.sign(projected)*Math.max(1,Math.round(Math.abs(projected)))),min,max);
  const frames=[{time:0,position:start}],dt=1/120;
  let position=start,v=speed;
  for(let frame=1;frame<=96;frame++) {
    v+=(260*(steps-position)-30*v)*dt;
    const next=position+v*dt;
    position=clamp(next,min,max);
    if(next!==position)v=0;
    frames.push({time:frame*dt*1000,position});
    if(Math.abs(position-steps)<.0015&&Math.abs(v)<.025)break;
  }
  frames.at(-1).position=steps;
  return {axis,steps,start,cell,limits,velocity:speed,duration:frames.at(-1).time,frames};
}

// 点击多格棋子的任意覆盖格，都可找到包含该落点的合法摆法。
// 拖动时保留实际抓取偏移；点选放置时优先让棋子中心靠近点击位置。
function choosePlacement(pieces, piece, gx, gy, grip = null) {
  if(gx<0||gy<0||gx>=WIDTH||gy>=HEIGHT) return null;
  const cellX=Math.floor(gx),cellY=Math.floor(gy);
  const idealX=gx-(grip?.x??piece.w/2),idealY=gy-(grip?.y??piece.h/2);
  let best=null;
  for(let y=Math.max(0,cellY-piece.h+1);y<=Math.min(cellY,HEIGHT-piece.h);y++) {
    for(let x=Math.max(0,cellX-piece.w+1);x<=Math.min(cellX,WIDTH-piece.w);x++) {
      if(!canPlace(pieces,piece,x,y)) continue;
      const score=(x-idealX)**2+(y-idealY)**2;
      if(!best||score<best.score-1e-9) best={x,y,score};
    }
  }
  return best ? {x:best.x,y:best.y} : null;
}


const SIDES = {
  top:{x:.5,y:0}, right:{x:1,y:.5}, bottom:{x:.5,y:1}, left:{x:0,y:.5}
};
const OPPOSITE = {top:'bottom',right:'left',bottom:'top',left:'right'};
const PRIORITY = ['top','right','bottom','left'];

// 按「新占据的空格」登记动作，大棋子的同一动作可覆盖两个空格。
function moveCells(pieces) {
  const cells = new Map();
  for (const action of moveArrows(pieces)) {
    const p = pieces.find(p => p.id === action.id);
    const side = action.dx > 0 ? 'left' : action.dx < 0 ? 'right' : action.dy > 0 ? 'top' : 'bottom';
    const strip = [];
    if (action.dx) for (let y=p.y; y<p.y+p.h; y++) strip.push({x:action.dx>0?p.x+p.w:p.x-1,y});
    else for (let x=p.x; x<p.x+p.w; x++) strip.push({x,y:action.dy>0?p.y+p.h:p.y-1});
    for (const {x,y} of strip) {
      const key = `${x},${y}`;
      if (!cells.has(key)) cells.set(key,{x,y,actions:[]});
      cells.get(key).actions.push({...action,side});
    }
  }
  return [...cells.values()].map(cell => ({...cell,actions:cell.actions.sort((a,b) => PRIORITY.indexOf(a.side)-PRIORITY.indexOf(b.side))}));
}

// 同距时使用固定侧边优先级，提示开关不改变点击的含义。
function pickCellAction(actions, x, y, threeMode='nearest') {
  if (!actions.length || x<0 || x>1 || y<0 || y>1) return null;
  if (actions.length === 1) return actions[0];
  let candidates = actions;
  if (actions.length === 3 && threeMode === 'quarters') {
    const side = PRIORITY.reduce((best,side) => {
      const p=SIDES[side],q=SIDES[best];
      return (x-p.x)**2+(y-p.y)**2 < (x-q.x)**2+(y-q.y)**2-1e-9 ? side : best;
    },'top');
    return actions.find(a => a.side === side) ?? null;
  }
  let best = null, score = Infinity;
  for (const action of candidates) {
    const p = SIDES[action.side];
    const bias = actions.length===3 && threeMode==='equal' && !actions.some(a => a.side===OPPOSITE[action.side]) ? 1/12 : 0;
    const distance = (x-p.x)**2+(y-p.y)**2-bias;
    if (distance < score-1e-9 || (Math.abs(distance-score)<1e-9 && PRIORITY.indexOf(action.side)<PRIORITY.indexOf(best?.side))) {best=action;score=distance;}
  }
  return best;
}

function pickMove(cells, gx, gy, threeMode='nearest') {
  if (gx<0 || gy<0 || gx>=4 || gy>=5) return null;
  const x=Math.floor(gx),y=Math.floor(gy);
  const cell=cells.find(cell => cell.x===x&&cell.y===y);
  return cell ? pickCellAction(cell.actions,gx-x,gy-y,threeMode) : null;
}


const SIDE_PRIORITY=['top','right','bottom','left'];
const DIRECTION_PRIORITY=['up','right','down','left'];
const key=a=>`${a.id}:${a.direction}`;
const CELL_SEEDS={top:{x:.5,y:0},right:{x:1,y:.5},bottom:{x:.5,y:1},left:{x:0,y:.5}};
const regionMetric=m=>({x:Number.isFinite(m.x)&&m.x>0?m.x:1,y:Number.isFinite(m.y)&&m.y>0?m.y:1});

// 无可进入动作的空格也登记，以完整识别相邻两格的整体范围。
function moveRegions(pieces) {
  const cells=moveCells(pieces);
  for(let y=0;y<5;y++)for(let x=0;x<4;x++) {
    if(pieces.some(p=>p.x>=0&&p.y>=0&&x>=p.x&&x<p.x+p.w&&y>=p.y&&y<p.y+p.h))continue;
    if(!cells.some(c=>c.x===x&&c.y===y))cells.push({x,y,actions:[]});
  }
  return cells.sort((a,b)=>a.y-b.y||a.x-b.x);
}

function regionFor(cells,x,y) {
  const start=cells.find(c=>c.x===x&&c.y===y);
  if(!start)return [];
  const region=[start];
  for(let i=0;i<region.length;i++)for(const cell of cells) {
    if(region.includes(cell))continue;
    if(Math.abs(cell.x-region[i].x)+Math.abs(cell.y-region[i].y)===1)region.push(cell);
  }
  return region;
}

function regionActions(region) {
  const unique=new Map();
  for(const cell of region)for(const action of cell.actions)unique.set(key(action),action);
  return [...unique.values()].sort((a,b)=>SIDE_PRIORITY.indexOf(a.side)-SIDE_PRIORITY.indexOf(b.side)||a.id-b.id||DIRECTION_PRIORITY.indexOf(a.direction)-DIRECTION_PRIORITY.indexOf(b.direction));
}

function clipMovePolygon(polygon,nx,ny,c) {
  const result=[];
  for(let i=0;i<polygon.length;i++) {
    const p=polygon[i],q=polygon[(i+1)%polygon.length],dp=nx*p.x+ny*p.y-c,dq=nx*q.x+ny*q.y-c;
    if(dp<=1e-10)result.push(p);
    if((dp<=0&&dq>0)||(dp>0&&dq<=0)) {
      const t=dp/(dp-dq);result.push({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t});
    }
  }
  return result;
}

// 检查页与游戏共用坐标：单格以侧边中点分区；相邻空格以真实指示标中心作中垂线。
// 同一大棋子的共享动作只使用一个中心，不能在每格虚构一个指示标。
function movePolygons(cells,metric={x:1,y:1}) {
  const seen=new Set(),result=[];
  for(const start of cells) {
    if(seen.has(start))continue;
    const region=regionFor(cells,start.x,start.y),actions=regionActions(region);
    for(const cell of region)seen.add(cell);
    const m=region.length===1?{x:1,y:1}:regionMetric(metric);
    const seeds=actions.map(action=>({action,...(region.length===1?
      {x:start.x+CELL_SEEDS[action.side].x,y:start.y+CELL_SEEDS[action.side].y}:
      {x:action.x,y:action.y})}));
    for(const seed of seeds)for(const cell of region) {
      let polygon=[{x:cell.x,y:cell.y},{x:cell.x+1,y:cell.y},{x:cell.x+1,y:cell.y+1},{x:cell.x,y:cell.y+1}];
      for(const other of seeds)if(other!==seed) {
        const nx=2*(other.x-seed.x)*m.x*m.x,ny=2*(other.y-seed.y)*m.y*m.y;
        const c=(other.x*other.x-seed.x*seed.x)*m.x*m.x+(other.y*other.y-seed.y*seed.y)*m.y*m.y;
        polygon=clipMovePolygon(polygon,nx,ny,c);
      }
      const area2=polygon.reduce((sum,p,i)=>{const q=polygon[(i+1)%polygon.length];return sum+p.x*q.y-q.x*p.y;},0);
      if(Math.abs(area2)>1e-10)result.push({cell,action:seed.action,polygon});
    }
  }
  return result;
}

// 只有相邻两空格采用整体的欧氏最近点分区；单格保留原规则。
// 三角坐标来自静止布局，提示动画不影响命中边界。
function pickGameMove(cells,gx,gy,metric={x:1,y:1}) {
  if(gx<0||gy<0||gx>=4||gy>=5)return null;
  const region=regionFor(cells,Math.floor(gx),Math.floor(gy));
  if(!region.length)return null;
  if(region.length===1)return pickCellAction(region[0].actions,gx-region[0].x,gy-region[0].y);
  const actions=regionActions(region);
  let best=null,distance=Infinity;
  const {x:sx,y:sy}=regionMetric(metric);
  for(const action of actions) {
    const d=((gx-action.x)*sx)**2+((gy-action.y)*sy)**2;
    if(d<distance-1e-9){best=action;distance=d;}
  }
  return best;
}


const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const bounded=p=>p.x>=0&&p.y>=0&&p.x+p.w<=WIDTH&&p.y+p.h<=HEIGHT;
const clip=(n,a,b)=>Math.max(a,Math.min(b,n));

// 同向连锁推动：前方的所有接触分支必须都能移动，才能移动整组。
function planPush(pieces,id,dx,dy) {
  if(!Number.isInteger(dx)||!Number.isInteger(dy)||Math.abs(dx)+Math.abs(dy)!==1)return null;
  const root=pieces.find(p=>p.id===id);
  if(!root||root.x<0)return null;
  const ids=new Set([id]),pending=[root];
  for(let i=0;i<pending.length;i++) {
    const next={...pending[i],x:pending[i].x+dx,y:pending[i].y+dy};
    if(!bounded(next))return null;
    for(const other of pieces)if(other.x>=0&&!ids.has(other.id)&&overlap(next,other)) {
      ids.add(other.id);pending.push(other);
    }
  }
  const leading=p=>dx>0?p.x+p.w:dx<0?-p.x:dy>0?p.y+p.h:-p.y;
  const order=[...pending].sort((a,b)=>leading(b)-leading(a)||a.id-b.id).map(p=>p.id);
  const next=pieces.map(p=>ids.has(p.id)?{...p,x:p.x+dx,y:p.y+dy}:{...p});
  return {id,dx,dy,ids:[...ids],order,next};
}

function pushRoute(pieces,id,dx,dy,max=4) {
  const plans=[];let board=clone(pieces);
  for(let i=0;i<max;i++) {
    const plan=planPush(board,id,dx,dy);if(!plan)break;
    plans.push(plan);board=plan.next;
    if(escaped(board))break;
  }
  return plans;
}

function routeScene(base,plans,travel) {
  const whole=Math.min(plans.length,Math.floor(Math.max(0,travel)+1e-8));
  const board=clone(whole?plans[whole-1].next:base);
  const fraction=clip(travel-whole,0,1),plan=plans[whole];
  if(plan&&fraction)for(const p of board)if(plan.ids.includes(p.id)) {p.x+=plan.dx*fraction;p.y+=plan.dy*fraction;}
  return board;
}

// 在整数落点重新判断自由度。半格中锁定轴，避免从横向位置瞬移到纵向位置。
class SlideSession {
  constructor(pieces,id,{axis=null,direction=1,progress=0}={}) {
    this.pieces=clone(pieces);this.id=id;this.axis=axis;this.direction=direction;

}


// 用棋盘坐标播放整组运动，尺寸变化不会留下旧像素偏移。
class BoardPlayback {
  constructor({onScene,onStep,onFinish}) {
    this.onScene=onScene;this.onStep=onStep;this.onFinish=onFinish;this.active=null;
  }
  play({base,plans,frames,steps,rootId,axis,direction,kind='kinetic'}) {
    this.stop();

    let resolve;const done=new Promise(r=>resolve=r);
    const state={base,plans,frames,steps,rootId,axis,direction,kind,duration,done,resolve,

    this.active=state;this.onScene(state.scene);
    const tick=now=>{
      if(this.active!==state)return;
      if(state.last!==null)state.elapsed+=(now-state.last)*state.speed;
      state.last=now;
      const time=Math.min(state.elapsed,duration);
      let i=0;while(i<frames.length-2&&frames[i+1].time<time)i++;

      const t=b.time===a.time?1:(time-a.time)/(b.time-a.time);
      state.travel=a.position+(b.position-a.position)*t;
      state.scene=routeScene(base,plans,state.travel);
      const reached=time===duration?steps:Math.min(steps,Math.floor(state.travel+1e-8));
      while(state.index<reached) {
        const plan=plans[state.index++];
        if(this.onStep(plan)===false) {this.stop();return;}
      }
      this.onScene(state.scene);
      if(time===duration) {
        this.active=null;this.onFinish();resolve(true);
      } else state.frame=requestAnimationFrame(tick);
    };

  }
  stop() {
    const state=this.active;if(!state)return null;
    cancelAnimationFrame(state.frame);this.active=null;state.resolve(state.steps>0&&state.index>=state.steps);return state;
  }
  finish() {
    const state=this.active;if(!state)return;
    cancelAnimationFrame(state.frame);
    while(state.index<state.steps) {
      if(this.onStep(state.plans[state.index++])===false) {this.stop();return;}
    }
    state.travel=state.steps;state.scene=routeScene(state.base,state.plans,state.steps);
    this.active=null;this.onScene(state.scene);this.onFinish();state.resolve(true);
  }
  hurry() {if(this.active)this.active.speed=4;}
}


// 布阵草稿、正在玩的棋局和重开时的起点各自保存，互不覆盖。
class Game {
  constructor(now = () => Date.now()) {
    this.now = now;
    this.mode = 'classic';
    this.preset = 0;
    this.draft = null;
    this.editorPinned = false;
    this.groupSerial = 0;
    this.activate(PRESETS[0].pieces);
  }

  activate(pieces) {
    this.pieces = clone(pieces);
    this.initial = clone(pieces);
    this.phase = escaped(pieces) ? 'won' : 'playing';
    this.selected = null;
    this.history = [];
    this.started = null;
    this.elapsed = 0;
  }

  selectPreset(index) {
    if (!Number.isInteger(index) || !PRESETS[index]) return false;
    this.preset = index;
    this.mode = 'classic';
    this.editorPinned = false;
    this.activate(PRESETS[index].pieces);
    return true;
  }

  enterCustom() {
    const current = this.mode === 'custom' ? this.pieces : null;
    const source = current ?? this.draft ?? PRESETS[0].pieces.map(p => ({...p, x:-1, y:-1}));
    this.editorPinned = validateLayout(source).valid;
    this.mode = 'custom';
    this.activate(source);
    this.phase = 'editing';
    this.draft = clone(source);
  }

  leaveEditor() {
    if (this.phase !== 'editing' || !validateLayout(this.pieces).valid) return false;
    this.editorPinned = false;
    this.activate(this.pieces);
    return true;
  }

  saveDraft() {
    this.draft = clone(this.pieces);
    if (!this.editorPinned && validateLayout(this.pieces).valid) this.activate(this.pieces);
  }

  select(id) {
    if (!this.pieces.some(p => p.id === id)) return false;
    this.selected = id;
    return true;
  }

  place(id, x, y) {
    const p = this.pieces.find(p => p.id === id);
    if (this.phase !== 'editing' || !p || !canPlace(this.pieces, p, x, y)) return false;
    p.x = x; p.y = y;
    this.selected = id;
    this.saveDraft();
    return true;
  }

  remove(id = this.selected) {
    const p = this.pieces.find(p => p.id === id);
    if (this.phase !== 'editing' || !p || p.x < 0) return false;
    p.x = -1; p.y = -1;
    this.saveDraft();
    return true;
  }

  rotate(id = this.selected) {
    const p = this.pieces.find(p => p.id === id);
    if (this.phase !== 'editing' || !p || p.id < 1 || p.id > 5) return false;
    if (p.x >= 0 && !canPlace(this.pieces, p, p.x, p.y, p.h, p.w)) return false;
    [p.w, p.h] = [p.h, p.w];
    this.saveDraft();
    return true;
  }

  clear() {
    if (this.phase !== 'editing') return false;
    this.pieces = this.pieces.map(p => ({...p, x:-1, y:-1}));
    this.selected = null;
    this.editorPinned = false;
    this.saveDraft();
    return true;
  }

  copyPreset() {
    if (this.phase !== 'editing') return false;
    this.pieces = clone(PRESETS[this.preset].pieces);
    this.selected = null;
    this.saveDraft();
    return true;
  }

  move(id, dx, dy) {
    if (this.phase !== 'playing') return false;
    const next = move(this.pieces, id, dx, dy);
    if (!next) return false;
    if (this.started === null) this.started = this.now();
    this.history.push({pieces:clone(this.pieces), selected:id});
    this.pieces = next;
    this.selected = id;
    if (escaped(next)) {
      this.elapsed = this.now() - this.started;
      this.phase = 'won';
    }
    return true;
  }

  push(id,dx,dy) {
    if(this.phase!=='playing')return null;
    const plan=planPush(this.pieces,id,dx,dy);if(!plan)return null;
    const group=++this.groupSerial;
    if(this.started===null)this.started=this.now();
    for(const movedId of plan.order) {
      this.history.push({pieces:clone(this.pieces),selected:id,group});
      this.pieces=move(this.pieces,movedId,dx,dy);
    }
    this.selected=id;
    if(escaped(this.pieces)) {this.elapsed=this.now()-this.started;this.phase='won';}
    return plan;
  }

  undo() {
    if (this.phase === 'editing' || !this.history.length) return false;
    let previous = this.history.pop();
    const group=previous.group;
    if(group!==undefined)while(this.history.at(-1)?.group===group)previous=this.history.pop();
    if (this.phase === 'won') this.started = this.now() - this.elapsed;
    this.pieces = previous.pieces;
    this.selected = previous.selected;
    this.phase = 'playing';
    if (!this.history.length) {this.started = null; this.elapsed = 0;}
    return true;
  }

  restart() {
    if (this.phase === 'editing') return false;
    this.activate(this.initial);
    return true;
  }

  get time() {
    return this.phase === 'playing' && this.started !== null ? this.now() - this.started : this.elapsed;
  }
}


// 提示开关只控制显示。当前棋局及求解路线上的后续局面始终预先缓存。
class Prediction {
  constructor({createWorker, onChange = () => {}, delay = 70, timeout = 28000} = {}) {
    this.createWorker = createWorker ?? (() => createInlineSolver());
    this.onChange = onChange;
    this.delay = delay;
    this.timeout = timeout;
    this.cache = new Map();
    this.ticket = 0;
    this.worker = null;
    this.timer = null;
    this.watchdog = null;
    this.current = {key:null, status:'idle', path:[]};
  }

  stop() {
    this.ticket++;
    clearTimeout(this.timer);
    clearTimeout(this.watchdog);
    this.timer = null;
    this.worker?.terminate();
    this.worker = null;
  }

  remember(key, result) {
    this.cache.delete(key);
    this.cache.set(key, result);
    if (this.cache.size > 300) this.cache.delete(this.cache.keys().next().value);
  }

  rememberRoute(pieces, result) {
    if (result.status === 'solved') {
      let board = clone(pieces);
      for (let i = 0; i < result.path.length; i++) {
        const step = result.path[i];
        const p = board.find(p => p.x + 4*p.y === step.from && p.w === step.w && p.h === step.h);
        if (!p) break;
        board = move(board, p.id, step.dx, step.dy);
        if (!board) break;
        this.remember(signature(board), {status:'solved', path:result.path.slice(i+1)});
      }
    }
    this.remember(signature(pieces), result);
  }

  setBoard(pieces, {immediate = false} = {}) {
    if (!validateLayout(pieces).valid) {
      this.stop();
      this.current = {key:null, status:'idle', path:[]};
      this.onChange(this.current);
      return;
    }
    const key = signature(pieces);
    if (key === this.current.key) {
      if (immediate && this.timer !== null) {clearTimeout(this.timer); this.timer = null; this.start();}
      return;
    }
    this.stop();
    this.pieces = clone(pieces);
    const cached = this.cache.get(key);
    this.current = {key, ...(cached ?? {status:'checking', path:[]})};
    this.onChange(this.current);
    if (cached) return;
    if (immediate) this.start();
    else this.timer = setTimeout(() => {this.timer = null; this.start();}, this.delay);
  }

  start() {
    if (this.worker || this.current.status !== 'checking') return;
    const ticket = ++this.ticket, key = this.current.key, pieces = clone(this.pieces);
    const complete = result => {
      if (ticket !== this.ticket || key !== this.current.key) return;
      clearTimeout(this.watchdog);
      this.worker?.terminate();
      this.worker = null;
      const clean = {status:result.status, path:result.path ?? []};
      if (['solved', 'unsolvable'].includes(clean.status)) this.rememberRoute(pieces, clean);
      this.current = {key, ...clean};
      this.onChange(this.current);
    };
    try {
      this.worker = this.createWorker();
      this.worker.onmessage = ({data}) => {
        if (data.type === 'result' && data.ticket === ticket) complete(data);
      };
      this.worker.onerror = () => complete({status:'error'});
      this.watchdog = setTimeout(() => complete({status:'limit'}), this.timeout);
      this.worker.postMessage({pieces, ticket});
    } catch {complete({status:'error'});}
  }

  retry() {
    if (!this.pieces || !['error', 'limit'].includes(this.current.status)) return;
    const pieces = clone(this.pieces);
    this.current = {key:null, status:'idle', path:[]};
    this.setBoard(pieces, {immediate:true});
  }

  dispose() {this.stop();}
}

function rectOf(id) {const e=pieces.get(id); return e&&!e.hidden?e.getBoundingClientRect():null;}
function settle(id, visual, motion=null) {

  const target=e.getBoundingClientRect();
  const dx=visual.left-target.left, dy=visual.top-target.top;
  const sx=visual.width/target.width, sy=visual.height/target.height;
  const moving=motion?.frames.some(frame=>Math.abs((frame.position-motion.start)*motion.cell)>=.5);
  if (!moving&&Math.abs(dx)+Math.abs(dy)<.5&&Math.abs(sx-1)+Math.abs(sy-1)<.01) return null;
  if(motion?.duration&&motion.frames.length>1) {
    const frames=motion.frames.map(frame=>{
      const distance=(frame.position-motion.start)*motion.cell;

function nextHint() {

}

function metrics() {

  return {left:r.left,top:r.top,width:r.width,height:r.height,cellX:r.width/4,cellY:r.height/5};
}
function boardPoint(event,m=metrics()) {
  const gx=(event.clientX-m.left)/m.cellX, gy=(event.clientY-m.top)/m.cellY;
  return {gx,gy,inside:gx>=0&&gy>=0&&gx<4&&gy<5};
}
function hidePreview() {$('placement-preview').hidden=true; delete $('placement-preview').dataset.anchor;}
function showPreview(piece,point,grip=null) {
  if (!point.inside) {hidePreview(); return null;}
  const anchor=choosePlacement(game.pieces,piece,point.gx,point.gy,grip);
  const x=anchor?.x??clamp(Math.round(point.gx-(grip?.x??piece.w/2)),0,4-piece.w);
  const y=anchor?.y??clamp(Math.round(point.gy-(grip?.y??piece.h/2)),0,5-piece.h);
  const e=$('placement-preview'); e.hidden=false; e.classList.toggle('invalid',!anchor);
  Object.assign(e.style,{left:`calc(${x*25}% + 3px)`,top:`calc(${y*20}% + 3px)`,width:`calc(${piece.w*25}% - 6px)`,height:`calc(${piece.h*20}% - 6px)`});
  e.dataset.anchor=`${x},${y}`; e.dataset.valid=String(Boolean(anchor)); return anchor;
}
function createGhost(gesture,piece) {

  ghost.innerHTML=pieces.get(piece.id).innerHTML; ghost.setAttribute('aria-hidden','true');
  ghost.style.width=`${piece.w*gesture.metrics.cellX-6}px`; ghost.style.height=`${piece.h*gesture.metrics.cellY-6}px`;
  ghost.style.setProperty('--ghost-font',`${clamp(gesture.metrics.cellX*.34,17,34)}px`);

function capturePointer(element,event) {
  try {element.setPointerCapture(event.pointerId);} catch {}
}
function beginPlayDrag(event,id,element,initial={}) {

  game.select(id);
  drag={id,source:'board',element,pointer:event.pointerId,startX:event.clientX,startY:event.clientY,
    lastX:event.clientX,lastY:event.clientY,metrics:metrics(),moved:session.progress>.001,session,
    samplesX:[{time:event.timeStamp,position:root.x}],samplesY:[{time:event.timeStamp,position:root.y}],

function beginEditorDrag(event,id,source,element) {

  drag={id,source,element,pointer:event.pointerId,startX:event.clientX,startY:event.clientY,
    metrics:metrics(),grip:{x:clamp((event.clientX-r.left)/r.width*piece.w,0,piece.w),
    y:clamp((event.clientY-r.top)/r.height*piece.h,0,piece.h)},moved:false,

function waitForDrag(event,id,source,element,promise) {
  const p=game.pieces.find(piece=>piece.id===id),r=element.getBoundingClientRect();
  const waiting={id,source,element,pointer:event.pointerId,startX:event.clientX,startY:event.clientY,
    lastX:event.clientX,lastY:event.clientY,lastTime:event.timeStamp,startTime:event.timeStamp,pending:true,moved:false,phase:game.phase,
    epoch:commandEpoch,promise,points:[],metrics:metrics(),grip:{x:clamp((event.clientX-r.left)/r.width*p.w,0,p.w),y:clamp((event.clientY-r.top)/r.height*p.h,0,p.h)}};
  drag=waiting;game.select(id);render();capturePointer(element,event);
  const resume=()=>{
    if(drag!==waiting)return;
    if(playback.active) {playback.hurry();playback.active.done.then(resume);return;}
    const next={pointerId:waiting.pointer,clientX:waiting.startX,clientY:waiting.startY,timeStamp:waiting.startTime};
    if(game.phase==='playing')beginPlayDrag(next,id,element);
    else if(game.phase==='editing')beginEditorDrag(next,id,source,element);
    else {consumeGesture(waiting);drag=null;render();return;}
    if(drag&&!drag.session)drag.grip=waiting.grip;

  };

function pointerDown(event,id,source='board') {
  if(event.button!==0||event.isPrimary===false||game.phase==='won')return;
  if(source==='inventory'&&game.phase!=='editing')return;
  if(drag&&event.pointerId!==drag.pointer)return;
  if(drag)finishGesture(null,'interrupt');
  hidePreview();
  const piece=game.pieces.find(p=>p.id===id),element=(source==='board'?pieces:inventory).get(id);
  if(source==='inventory'&&piece.x>=0)return;
  event.preventDefault();
  if(game.phase==='playing') {
    commandEpoch++;for(const command of queuedCommands)command.resolve(false);queuedCommands=[];
    const flight=playback.active;
    if(flight&&flight.rootId===id&&flight.kind!=='undo') {
      const initial={axis:flight.axis,direction:flight.direction,progress:clamp(flight.travel-flight.index,0,1),
        originalCommand:flight.kind==='command'?{remaining:flight.steps-flight.index}:null};
      stopPlayback();beginPlayDrag(event,id,element,initial);return;
    }
    if(flight) {playback.hurry();waitForDrag(event,id,source,element,flight.done);return;}
  }
  if(game.phase==='editing')commandEpoch++;
  const animations=(game.phase==='playing'?[...pieces.values()]:[element]).flatMap(e=>e.getAnimations()).filter(a=>a.constructor.name==='Animation');
  if(animations.length) {
    waitForDrag(event,id,source,element,Promise.all(animations.map(a=>a.finished.catch(()=>{}))));return;
  }

}
function editorAnchor(current,piece,event) {
  const point=boardPoint(event,current.metrics);
  current.entered ||= point.inside;
  if(!current.entered)return {point,anchor:null};
  const originX=clamp(point.gx-current.grip.x,0,4-piece.w);
  const originY=clamp(point.gy-current.grip.y,0,5-piece.h);
  const held={gx:clamp(originX+current.grip.x,0,4-1e-8),gy:clamp(originY+current.grip.y,0,5-1e-8),inside:true};
  return {point,anchor:showPreview(piece,held,current.grip)};
}
function pointerMove(event) {
  if(emptyPress?.pointer===event.pointerId&&Math.hypot(event.clientX-emptyPress.x,event.clientY-emptyPress.y)>8)emptyPress.moved=true;
  if(!drag||event.pointerId!==drag.pointer)return;
  if(event.type==='pointermove'&&event.pointerType==='mouse'&&!(event.buttons&1)) {finishGesture(null,'interrupt');return;}
  if(drag.pending) {
    const bundled=event.type==='pointermove'?event.getCoalescedEvents?.()??[]:[];
    const points=bundled.length?bundled:[event];
    for(const point of points)drag.points.push({x:point.clientX,y:point.clientY,time:point.timeStamp});
    drag.lastX=event.clientX;drag.lastY=event.clientY;drag.lastTime=event.timeStamp;
    drag.moved ||= Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)>=6;return;
  }
  const dx=event.clientX-drag.startX,dy=event.clientY-drag.startY;
  if(drag.session&&Math.hypot(dx,dy)>=6)drag.pointerMoved=true;
  if(!drag.moved&&Math.hypot(dx,dy)<6)return;
  const p=game.pieces.find(p=>p.id===drag.id),m=drag.metrics;
  if(!drag.moved) {
    drag.moved=true;document.body.classList.add('drag-active');

    const bundled=event.type==='pointermove'?event.getCoalescedEvents?.()??[]:[];
    const points=bundled.length?[...bundled]:[event],last=points.at(-1);
    if(last.clientX!==event.clientX||last.clientY!==event.clientY)points.push(event);

      const completed=drag.session.advance((point.clientX-drag.lastX)/m.cellX,(point.clientY-drag.lastY)/m.cellY,6/Math.max(m.cellX,m.cellY));
      drag.lastX=point.clientX;drag.lastY=point.clientY;drag.lastTime=point.timeStamp;
      for(const plan of completed)game.push(plan.id,plan.dx,plan.dy);
      changedBoard ||= completed.length>0;
      const root=drag.session.root();
      drag.samplesX=dragSample(drag.samplesX,root.x,point.timeStamp,.003);
      drag.samplesY=dragSample(drag.samplesY,root.y,point.timeStamp,.003);

  if(drag.source==='inventory') {
    let left=event.clientX-drag.grip.x*m.cellX+3,top=event.clientY-drag.grip.y*m.cellY+3;
    if(drag.entered) {

      top=m.top+clamp(point.gy-drag.grip.y,0,5-p.h)*m.cellY+3;
    }
    drag.ghost.style.left=left+'px';drag.ghost.style.top=top+'px';
  } else {
    drag.offsetX=clamp(dx,-p.x*m.cellX,(4-p.w-p.x)*m.cellX);
    drag.offsetY=clamp(dy,-p.y*m.cellY,(5-p.h-p.y)*m.cellY);
    drag.element.style.transform='translate('+drag.offsetX+'px,'+drag.offsetY+'px)';
  }
  render();
}
function finishGesture(event,reason='release') {

    if(current.phase==='playing')return new Promise(resolve=>{queuedCommands.push({...current,path:true,epoch:commandEpoch,resolve});drainCommands();});
    return current.promise.then(()=>{
      if(current.epoch!==commandEpoch||drag||game.phase!=='editing')return false;
      const p=game.pieces.find(piece=>piece.id===current.id),m=metrics();

    if(!current.moved&&!current.originalCommand?.remaining||!state.axis) {scene=null;render();return Promise.resolve(false);}
    let velocity=reason==='release'?dragVelocity(state.axis==='x'?current.samplesX:current.samplesY,event.timeStamp)*state.direction:0;
    const last=current.session.steps.at(-1);

  }
  prediction.setBoard(game.pieces);render();if(game.phase==='won')celebrate();
}

$('grid-cells').innerHTML='<span></span>'.repeat(20);
for (const p of PRESETS[0].pieces) {
  const e=document.createElement('button'); e.type='button'; e.dataset.piece=p.id;
  const name=document.createElement('span'); name.className='piece-name'; name.textContent=t(p.name); e.append(name);
  if (p.id===0) {const role=document.createElement('span'); role.className='piece-role'; role.textContent=t('魏 王'); e.append(role);}
  e.addEventListener('pointerdown',event => pointerDown(event,p.id));
  e.addEventListener('click',event => {event.stopPropagation(); if (event.detail===0) selectPiece(p.id);});
  e.addEventListener('lostpointercapture',event => {if (drag?.pointer===event.pointerId) pointerUp(null,true);});
  $('pieces').append(e); pieces.set(p.id,e);
  const choice=document.createElement('button'); choice.type='button'; choice.dataset.inventoryPiece=p.id;
  const trayName=document.createElement('span'); trayName.className='tray-name'; trayName.textContent=t(p.name); choice.append(trayName);
  choice.addEventListener('pointerdown',event => pointerDown(event,p.id,'inventory'));
  choice.addEventListener('click',event => {event.stopPropagation(); if (event.detail===0&&game.phase==='editing') selectPiece(p.id);});
  choice.addEventListener('lostpointercapture',event => {if (drag?.pointer===event.pointerId) pointerUp(null,true);});
  $('inventory').append(choice); inventory.set(p.id,choice);
  for (const [direction,[dx,dy]] of Object.entries(DIRECTIONS)) {
    const arrow=document.createElement('button'); arrow.type='button'; arrow.className=`move-arrow ${direction}`;
    arrow.innerHTML='<span class="arrow-glyph"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4 L15 10 L6 16 Z"/></svg></span>';
    arrow.dataset.pieceId=p.id; arrow.dataset.direction=direction;
    arrow.setAttribute('aria-label',moveLabel(p,direction));
    arrow.onclick=event => {event.stopPropagation(); movePiece(p.id,dx,dy);};
    $('move-arrows').append(arrow); arrowButtons.set(`${p.id}:${direction}`,arrow);
  }
}
PRESETS.forEach((preset,i) => {
  const e=document.createElement('button'); e.type='button'; e.className='preset'; e.setAttribute('aria-label',`选择${preset.name}阵型`);
  e.innerHTML=`<div class="mini-board" aria-hidden="true">${preset.pieces.map(p => `<span class="mini-block ${p.id===0?'cao':p.id>=6?'soldier':''}" style="left:${p.x*25}%;top:${p.y*20}%;width:${p.w*25}%;height:${p.h*20}%"></span>`).join('')}</div><span class="preset-name">${preset.name}</span>`;
  e.onclick=() => changeLayout(() => game.selectPreset(i)); $('presets').append(e);
});
window.addEventListener('pointerdown',event => {
  if(event.isPrimary===false||drag&&event.pointerId!==drag.pointer) {
    blockedPointers.add(event.pointerId);consumedPointers.set(event.pointerId,performance.now());event.preventDefault();event.stopPropagation();return;
  }
  for(const [id,time] of consumedPointers)if(performance.now()-time>2000)consumedPointers.delete(id);
  if(!drag)blockedPointers.clear();
  consumedPointers.delete(event.pointerId);blockedPointers.delete(event.pointerId);
  suppressClick=false;emptyPress=null;
},true);
window.addEventListener('pointermove',pointerMove,{passive:true});
window.addEventListener('pointerup',event => {if(emptyPress?.pointer===event.pointerId)emptyPress.up=true;pointerUp(event);});
window.addEventListener('pointercancel',event => {if (emptyPress?.pointer===event.pointerId) emptyPress.moved=true; pointerUp(event,true);});
window.addEventListener('blur',event=>{if(event.target===window){finishGesture(null,'hidden');finishVisibleMotion();cancelCommands();}});
window.addEventListener('resize',() => {if(drag)finishGesture(null,'interrupt');if(!compact.matches)pickerOpen=false;render();});
document.addEventListener('visibilitychange',() => {if(document.hidden){finishGesture(null,'hidden');finishVisibleMotion();cancelCommands();}});
window.addEventListener('click',event => {
  const pointerClick=event.detail!==0||Boolean(event.pointerType&&event.pointerId>0);
  if(pointerClick&&(suppressClick||consumedPointers.has(event.pointerId)||blockedPointers.has(event.pointerId))) {
    event.preventDefault();event.stopPropagation();
  }
},true);
$('board').addEventListener('click',event => {
  if (event.button!==0||event.target.closest('.piece,.move-arrow')) return;
  const point=boardPoint(event); if (!point.inside) return;
  const press=emptyPress;emptyPress=null;
  if(!press||!press.up||press.moved||press.phase!==game.phase||event.timeStamp<press.time||Math.hypot(event.clientX-press.x,event.clientY-press.y)>8||
     event.pointerId>0&&event.pointerId!==press.pointer)return;
  if (game.phase==='playing') {
    if(press.key!==signature(game.pieces)&&!press.inMotion)return;
    const action=press.action;
    if (action) movePiece(action.id,action.dx,action.dy);
    return;
  }
  if (game.phase!=='editing'||game.selected===null) return;
  const p=game.pieces.find(p => p.id===game.selected), anchor=choosePlacement(game.pieces,p,point.gx,point.gy);
  if (!putPiece(p.id,anchor,rectOf(p.id))) toast('空间不足');
});
$('board').addEventListener('pointerdown',event => {
  if(event.button===0&&event.isPrimary!==false&&!drag&&!event.target.closest('.piece,.move-arrow')) {
    const point=boardPoint(event);
    emptyPress={key:signature(game.pieces),phase:game.phase,pointer:event.pointerId,time:event.timeStamp,x:event.clientX,y:event.clientY,moved:false,up:false,
      inMotion:Boolean(playback.active),action:game.phase==='playing'?pickGameMove(cells,point.gx,point.gy,{x:metrics().cellX,y:metrics().cellY}):null};
  }
});
$('board').addEventListener('pointermove',event => {
  if (event.pointerType==='touch') return;
  hoverPoint={clientX:event.clientX,clientY:event.clientY};
  if (game.phase==='playing') {showHovered(boardPoint(event));return;}
  if (drag||game.phase!=='editing'||game.selected===null) return;
  showPreview(game.pieces.find(p => p.id===game.selected),boardPoint(event));
});
$('board').addEventListener('pointerleave',() => {hoverPoint=null;showHovered(null);if (!drag) hidePreview();});
$('setup-open').onclick=() => showPicker(!pickerOpen);
$('setup-close').onclick=() => showPicker(false);
$('drawer-scrim').onclick=() => showPicker(false);
$('classic-tab').onclick=() => {if (game.phase==='editing') showPicker(true);};
$('custom-tab').onclick=() => {if (game.phase==='editing') showPicker(false); else changeLayout(() => game.enterCustom());};
$('edit-toggle').onclick=toggleEditing;
$('hint-button').onclick=() => setHints(!hints);
$('rotate-button').onclick=() => {cancelGesture(); const before=game.phase,id=game.selected,visual=rectOf(id); if (game.rotate()) changed(before,id,visual);};
$('remove-button').onclick=() => {cancelGesture(); const before=game.phase; if (game.remove()) changed(before);};
$('copy-layout').onclick=() => changeLayout(() => game.copyPreset());
$('clear-layout').onclick=() => changeLayout(() => game.clear());
$('undo-button').onclick=() => requestUndo();
$('restart-button').onclick=() => changeLayout(() => game.restart());
document.querySelector('.brand').onclick=event => {event.preventDefault(); changeLayout(() => game.selectPreset(0));};
$('rules-button').onclick=() => {cancelGesture(); pickerOpen=false; render(); $('rules-dialog').showModal();};
for (const e of document.querySelectorAll('[data-close]')) e.onclick=() => $(e.dataset.close).close();
document.addEventListener('keydown',event => {
  if (event.key==='Escape') {cancelGesture(); pickerOpen=false; render(); return;}
  if (document.querySelector('dialog[open]')||event.ctrlKey||event.metaKey||event.altKey||event.target.closest('input,textarea,select,.tabs')) return;
  if (event.key.toLowerCase()==='z'&&game.history.length) {event.preventDefault(); $('undo-button').click();}
});
const timer=setInterval(() => {if (game.phase==='playing') $('timer').textContent=timeLabel(game.time);},500);
window.addEventListener('pagehide',() => {finishGesture(null,'hidden');finishVisibleMotion();cancelCommands();prediction.dispose();clearInterval(timer);clearTimeout(victoryTimer);clearTimeout(toastTimer);});
compact.addEventListener('change',() => {if(drag)finishGesture(null,'interrupt');if(!compact.matches)pickerOpen=false;render();});
reducedMotion.addEventListener('change',event=>{
  if(event.matches) {
    playback.finish();
    for(const e of pieces.values())for(const a of e.getAnimations())if(a.constructor.name==='Animation')a.finish();
    render();
  }
});
ready=true; applyLanguage(); render(); prediction.setBoard(game.pieces);

const context=document.modelContext;
if (context?.registerTool) {
  const lifecycle=new AbortController();
  const readState=() => ({phase:game.phase,layout:game.mode==='custom'?t(t("自定义")):t(PRESETS[game.preset].name),pieces:clone(game.pieces),selected:game.selected,moves:game.history.length,hintsEnabled:hints,hintStatus:hints?prediction.current.status:'off',predictionStatus:prediction.current.status,precomputed:prediction.current.status==='solved',loading:prediction.current.status==='checking',inMotion:Boolean(playback.active),dragging:drag?{pieceId:drag.id,source:drag.source,moved:drag.moved}:null,nextMove:hints?prediction.current.path[0]??null:null});
  const tools=[
    {name:'get_huarongdao_state',title:t("查看华容道棋局"),description:t("读取棋盘、步数、后台预计算与拖动状态。"),inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(input) {if (input&&Object.keys(input).length) throw new Error(t("不需要参数。")); return readState();}},
    {name:'move_huarongdao_piece',title:t("移动华容道棋子"),description:t("沿指定方向移动一格。"),inputSchema:{type:'object',properties:{pieceId:{type:'integer',minimum:0,maximum:9},direction:{type:'string',enum:['up','right','down','left']}},required:['pieceId','direction'],additionalProperties:false},async execute(input) {if (!input||Object.keys(input).some(k => !['pieceId','direction'].includes(k))||!Number.isInteger(input.pieceId)||input.pieceId<0||input.pieceId>9||!Object.hasOwn(DIRECTIONS,input.direction)) throw new Error(t("无效参数。")); const [dx,dy]=DIRECTIONS[input.direction]; if (!await movePiece(input.pieceId,dx,dy)) throw new Error(t("方向受阻或正在布阵。")); return readState();}},
    {name:'set_huarongdao_hints',title:t("开关华容道提示"),description:t("切换小三角的提示动画，后台预计算始终执行。"),inputSchema:{type:'object',properties:{enabled:{type:'boolean'}},required:['enabled'],additionalProperties:false},execute(input) {if (!input||typeof input.enabled!=='boolean'||Object.keys(input).some(k => k!=='enabled')) throw new Error(t("enabled 必须为布尔值。")); if (!setHints(input.enabled)) throw new Error(t("正在布阵。")); return readState();}}
